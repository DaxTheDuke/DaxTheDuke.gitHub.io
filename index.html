<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page d'accueil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="finaldax.css">
</head>
<body>
    <!-- Boutons pour changer de page -->
    <div class="page-buttons">
        <button onclick="showPage(1,this)">Principal</button>
        <button onclick="showPage(2,this)">Informatique</button>
        <button onclick="showPage(3,this)">Page 3</button>
        <button onclick="showPage(4,this)">Page 4</button>
        <button onclick="showPage(5,this)">Loisirs et Jeux</button>
        
        <!-- Calendrier -->
        <div class="calendar-container">
            <div class="calendar">
                <h2 id="calendarMonthYear">Octobre 2026</h2>
                <div class="calendar-weekdays">
                    <span>Lun</span>
                    <span>Mar</span>
                    <span>Mer</span>
                    <span>Jeu</span>
                    <span>Ven</span>
                    <span>Sam</span>
                    <span>Dim</span>
                </div>
                <div class="calendar-days" id="calendarDays"></div>
            </div>
        </div>

        <!-- Horloge -->
        <div class="clock-container">
            <div class="clock">
                <div class="time" id="time">09:06</div>
                <div class="date" id="date">Jeudi 1 octobre 2026</div>
            </div>
        </div>
    </div>

    <!-- Zone de liens internet (grid 8x6) -->
    <div style="height: 651px;" class="internet-links-grid" id="linksGrid">
        <!-- Les liens seront ajoutés dynamiquement via JavaScript -->
    </div>

    <script src="finaldax.js"></script>
</body>
</html>
